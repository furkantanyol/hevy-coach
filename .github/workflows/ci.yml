name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - name: Check packages are publishable
        run: |
          pnpm --filter @furkantanyol/hevy-client exec pnpm dlx publint
          pnpm --filter hevy-coach exec pnpm dlx publint
